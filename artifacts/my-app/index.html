<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#181b21" />
    <title>IdleRPG</title>
    <meta name="description" content="IdleRPG — Your adventure never sleeps. Chop, craft and conquer." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="IdleRPG" />
    <meta property="og:description" content="IdleRPG — Your adventure never sleeps. Chop, craft and conquer." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IdleRPG" />
    <meta name="twitter:description" content="IdleRPG — Your adventure never sleeps." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* Тёмный фон ДО загрузки бандла — убирает белую вспышку */
      html, body { background: #181b21; margin: 0; }

      /* Статичный boot-splash: рендерится мгновенно без JS */
      #boot-splash {
        position: fixed; inset: 0; z-index: 99999;
        background: #181b21;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 24px;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        transition: opacity 0.35s ease;
      }
      #boot-splash.fade-out { opacity: 0; pointer-events: none; }
      #boot-splash .dots {
        position: absolute; inset: 0; opacity: 0.3;
        background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      #boot-splash .logo-row { display: flex; align-items: center; gap: 12px; z-index: 1; }
      #boot-splash .logo-box {
        width: 48px; height: 48px; border-radius: 12px;
        background: rgba(99,102,241,0.2); border: 1px solid rgba(99,102,241,0.4);
        display: flex; align-items: center; justify-content: center; font-size: 24px;
        box-shadow: 0 0 20px rgba(99,102,241,0.25);
      }
      #boot-splash h1 { margin: 0; font-size: 30px; font-weight: 900; color: #f4f4f5; letter-spacing: -0.02em; }
      #boot-splash h1 span { color: #818cf8; }
      #boot-splash .ver { font-size: 10px; color: #71717a; font-family: monospace; text-transform: uppercase; letter-spacing: 0.2em; margin-top: 2px; }
      #boot-splash .bar { width: 192px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.1); overflow: hidden; z-index: 1; }
      #boot-splash .bar i {
        display: block; height: 100%; width: 40%; border-radius: 999px;
        background: linear-gradient(90deg, #6366f1, #818cf8);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(500%); }
      }
    </style>
  </head>
  <body>
    <!-- Статичный сплэш: виден мгновенно, React удалит его после монтирования -->
    <div id="boot-splash">
      <div class="dots"></div>
      <div class="logo-row">
        <div class="logo-box">🔥</div>
        <div>
          <h1>Idle<span>RPG</span></h1>
          <div class="ver">v2.1</div>
        </div>
      </div>
      <div class="bar"><i></i></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
